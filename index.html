<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banking System Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:30px;
    width:400px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:#2a5298;
    margin-bottom:20px;
}

.balance{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:green;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-size:16px;
}

.deposit{
    background:green;
}

.withdraw{
    background:red;
}

.history{
    margin-top:20px;
}

.history h3{
    margin-bottom:10px;
    color:#333;
}

ul{
    list-style:none;
    max-height:150px;
    overflow-y:auto;
}

li{
    padding:8px;
    border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<h1>🏦 Banking System</h1>

<div class="balance">
₹ <span id="balance">1000</span>
</div>

<input type="number" id="amount" placeholder="Enter Amount">

<div class="buttons">
<button class="deposit" onclick="depositMoney()">Deposit</button>
<button class="withdraw" onclick="withdrawMoney()">Withdraw</button>
</div>

<div class="history">
<h3>Transaction History</h3>
<ul id="history"></ul>
</div>

</div>

<script>

let balance = 1000;

function updateBalance(){
    document.getElementById("balance").innerText = balance;
}

function addHistory(text){
    let li = document.createElement("li");
    li.innerText = text;
    document.getElementById("history").prepend(li);
}

function depositMoney(){

    let amount =
    parseFloat(document.getElementById("amount").value);

    if(amount > 0){

        balance += amount;
        updateBalance();

        addHistory(
        "✅ Deposited ₹" + amount
        );

        document.getElementById("amount").value="";
    }
    else{
        alert("Enter valid amount");
    }
}

function withdrawMoney(){

    let amount =
    parseFloat(document.getElementById("amount").value);

    if(amount <= 0){
        alert("Enter valid amount");
        return;
    }

    if(amount > balance){
        alert("Insufficient Balance");
        return;
    }

    balance -= amount;

    updateBalance();

    addHistory(
    "❌ Withdrawn ₹" + amount
    );

    document.getElementById("amount").value="";
}

</script>

</body>
</html>
